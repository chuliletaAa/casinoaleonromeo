<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrera de caballos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="estilogral.css">
</head>
<body>
     <h1>Carrera de caballos</h1>
    
    <button id="inicio">Inicio</button>

    <div class="carrera">
        <div class="caballo1">🐴</div>
        <div class="caballo2">🦄</div>
        <div class="caballo3">🐢</div>
    </div>

    <div class="container">
        <h1 id="jugadorfichas">Jugador: </h1>

            <div class="seleccionCaballos">
                <button class="caballoBot" id="caballoApuesta1">
                    <div class="caballoNombre">juan</div>
                    <div class="caballoImg">🐴</div>
                </button>

                <button class="caballoBot" id="caballoApuesta2">
                    <div class="caballoNombre">Julietaaleon</div>
                    <div class="caballoImg">🦄</div>
                </button>

                <button class="caballoBot" id="caballoApuesta3">
                    <div class="caballoNombre">Santi</div>
                    <div class="caballoImg">🐢</div>
                </button>
            </div>

            <div class="areaApuesta"></div>
            <input type="number" id="cantApuesta" placeholder="Apuesta"> 
            <button id="botApuesta">Apostar</button>


    </div>





    <script src="caballos.js"></script>
</body>
</html>
